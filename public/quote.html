<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CoolHome Vault — Active Quote Session</title>
  <meta name="theme-color" content="#f9efe5">
  <link rel="preload" href="/fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="vault-body">
  <div id="chrome"></div>
  <div class="vault-stage">
    <div class="vault-device" id="vault-device">
      <div class="vault-notch" aria-hidden="true"></div>
      <div id="vault-header"></div>
      <main class="vault-inner">
        <div class="progress" id="progress"></div>
        <div id="alert" class="alert bad hidden" role="alert"></div>
        <section class="vault-card" id="step" aria-live="polite"></section>
        <div class="vault-foot" id="vault-foot">100% server-calculated &middot; No sales visit required</div>
        <div class="home-indicator" aria-hidden="true"></div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/progress.js"></script>
  <script src="/js/quote.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — CoolHome Vault</title>
  <meta name="theme-color" content="#f9efe5">
  <link rel="preload" href="/fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="vault-body">
  <div id="chrome"></div>
  <div class="vault-stage">
    <div class="vault-device">
      <div class="vault-notch" aria-hidden="true"></div>
      <div id="vault-header"></div>
      <main class="vault-inner">
        <section class="vault-card" id="login-card">
          <div class="vault-head">
            <h1>Who’s stepping in?</h1>
            <p class="vault-prompt">Choose a demo role or enter your credentials...</p>
          </div>
          <div id="denied" class="alert warn hidden" role="alert">Your account doesn't have access to that page.</div>

          <section id="demo" class="hidden" aria-label="Demo accounts">
            <div class="small muted center"><strong>Demo as&hellip;</strong> (autofills email &amp; password)</div>
            <div class="role-cards" id="role-cards">
              <button type="button" class="role-card" data-demo="homeowner@demo.com"><span class="ri" id="ri-h"></span><b>Homeowner</b><span>Quote flow</span></button>
              <button type="button" class="role-card" data-demo="sales@demo.com"><span class="ri" id="ri-s"></span><b>Sales</b><span>Pipeline</span></button>
              <button type="button" class="role-card" data-demo="admin@demo.com"><span class="ri" id="ri-a"></span><b>Admin</b><span>Catalog &amp; rules</span></button>
            </div>
          </section>

          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required>
            </div>
            <div class="field">
              <label for="password">Password</label>
              <div class="pw-wrap">
                <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
                <button type="button" id="pw-toggle" aria-label="Show password">Show</button>
              </div>
            </div>
            <div id="error" class="alert bad hidden" role="alert"></div>
            <button class="btn block lg mt" type="submit" id="submit">Sign in</button>
          </form>

          <p class="center small mt mb0"><a href="/quote">Continue to quote without signing in &rarr;</a></p>
        </section>
        <div class="vault-foot">Signed httpOnly session &middot; Role-protected access</div>
        <div class="home-indicator" aria-hidden="true"></div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>

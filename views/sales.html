<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Vault — CoolHome</title>
  <link rel="preload" href="/fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <div class="main">
      <div id="chrome"></div>
      <div class="dash-body">
        <section class="dash-hero">
          <h1>Sales pipeline</h1>
          <p>Locked quotes and paid deposits. In-memory demo data - resets when the server restarts.</p>
          <div class="row-actions" id="hero-actions"></div>
        </section>

        <div class="kpis" id="kpis"></div>

        <div class="panels">
          <div class="panel"><h3>Quotes locked <small>last 14 days</small></h3><div id="chart-days"></div></div>
          <div class="panel"><h3>Status mix</h3><div id="chart-status"></div></div>
          <div class="panel"><h3>By brand</h3><div id="chart-brand"></div></div>
        </div>

        <form class="filters" id="filters">
          <div><label for="f-q">Search</label><input id="f-q" type="search" placeholder="Ref, name, email, ZIP" maxlength="80"></div>
          <div><label for="f-status">Status</label><select id="f-status"><option value="">All</option><option value="locked">Locked</option><option value="paid">Paid</option><option value="expired">Expired</option></select></div>
          <div><label for="f-brand">Brand</label><select id="f-brand"><option value="">All</option></select></div>
          <div><label for="f-from">From</label><input id="f-from" type="date"></div>
          <div><label for="f-to">To</label><input id="f-to" type="date"></div>
          <div class="actions"><button class="btn ghost" type="button" id="reset">Reset</button><a class="btn" id="export" href="/api/sales/orders.csv" download>Export CSV</a></div>
        </form>

        <div id="alert" class="alert bad hidden" role="alert"></div>
        <div class="table-wrap">
          <table class="data">
            <thead><tr><th>Reference</th><th>Status</th><th>Customer</th><th>System</th><th>Total</th><th>Deposit</th><th>Locked</th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
          <div id="empty"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="drawer" class="drawer hidden" role="dialog" aria-modal="true" aria-label="Order detail"><div class="drawer-panel" id="drawer-panel"></div></div>
  <script src="/js/common.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/sales.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deposit Checkout — CoolHome Vault</title>
  <meta name="theme-color" content="#f9efe5">
  <link rel="preload" href="/fonts/serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="vault-body">
  <div id="chrome"></div>
  <div class="vault-stage">
    <div class="vault-device">
      <div class="vault-notch" aria-hidden="true"></div>
      <div id="vault-header"></div>
      <main class="vault-inner">
        <section class="vault-card" id="box"><p class="muted center"><span class="spinner dark"></span> Preparing your deposit…</p></section>
        <div class="vault-foot">Deposit calculated on our server &middot; Card details never stored</div>
        <div class="home-indicator" aria-hidden="true"></div>
      </main>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/fx.js"></script>
  <script src="/js/mock-pay.js"></script>
</body>
</html>
